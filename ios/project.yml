# XcodeGen spec — run `xcodegen` in this folder to create CanliTune.xcodeproj
name: CanliTune
options:
  bundleIdPrefix: com.canlitune
  deploymentTarget:
    iOS: "15.0"
targets:
  CanliTune:
    type: application
    platform: iOS
    sources:
      - path: CanliTune
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canlitune.app
        PRODUCT_NAME: CanliTune
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: CanliTune/CanliTune-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_OPTIMIZATION_LEVEL: "3"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO
    info:
      path: CanliTune/Info.plist
      properties:
        CFBundleDisplayName: VoxPulse
        NSMicrophoneUsageDescription: CanlıTune sesini canlı olarak perde düzeltmesinden geçirmek için mikrofonu kullanır.
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
